[package]
name = "lab-inventory"
version = "2.2.1"
description = "Lab Inventory & Management App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
serde_json = "1.0"
url = "2"

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "system-tray", "dialog-save" ] }
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
argon2 = "0.5"
rand_core = "0.6"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10.9"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
hkdf = "=0.12.4"
tar = "=0.4.45"
zeroize = "1.8.2"
reqwest = { version = "0.11.27", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
working-encryption = [ "rusqlite/bundled-sqlcipher-vendored-openssl" ]
