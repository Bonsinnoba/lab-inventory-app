name: labos-v1
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.v1
    volumes:
      - v1_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    # Deliberately pinned: development source changes must not rebuild daily-use V1.
    image: sha256:d636cca4f09d028ece263094563dc5a5540858a6361d1b480d1c847bb74d4796
    pull_policy: never
    restart: unless-stopped
    env_file: .env.v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - v1_storage:/app/storage
    ports:
      - '127.0.0.1:4010:4000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
volumes:
  v1_postgres:
    name: labos_v1_postgres
  v1_storage:
    name: labos_v1_storage
