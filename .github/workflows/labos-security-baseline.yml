name: LabOS security baseline
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/labos-security-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run permission and context baseline tests
        run: npm run test:security-baseline
