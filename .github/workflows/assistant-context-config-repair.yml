name: LabOS assistant config repair v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repair assistant per-request config
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'backend/src/routes/assistant.js';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const content = Buffer.from(file.content, 'base64').toString('utf8');
            const old = "const forceContextTool=/\\b(how many|count|exists?|list|show|which|who|when|where|how much|how many|experiment|experiments|task|tasks|note|notes|resource|resources|inventory|item|items|budget|expense|expenses|transaction|transactions|activity|members?|quantity|status|details|project)\\b/i.test(message)&&context.scope!=='none';const chat=ai.chats.create({model:MODEL_NAME,history,config:{tools:[{functionDeclarations:availableTools.map(t=>({name:t.name,description:t.description,parametersJsonSchema:t.parameters}))}],systemInstruction:scopedSystemInstruction(context),...(forceContextTool?{toolConfig:{functionCallingConfig:{mode:'ANY'}}}:{})}});\n    let response=await chat.sendMessage({message,config:{abortSignal:abortController.signal}});";
            const replacement = "const forceContextTool=/\\b(how many|count|exists?|list|show|which|who|when|where|how much|experiment|experiments|task|tasks|note|notes|resource|resources|inventory|item|items|budget|expense|expenses|transaction|transactions|activity|members?|quantity|status|details|project)\\b/i.test(message)&&context.scope!=='none';const chatConfig={tools:[{functionDeclarations:availableTools.map(t=>({name:t.name,description:t.description,parametersJsonSchema:t.parameters}))}],systemInstruction:scopedSystemInstruction(context),...(forceContextTool?{toolConfig:{functionCallingConfig:{mode:'ANY'}}}:{})};const chat=ai.chats.create({model:MODEL_NAME,history,config:chatConfig});\n    let response=await chat.sendMessage({message,config:{...chatConfig,abortSignal:abortController.signal}});";
            if (!content.includes(old)) core.setFailed('Assistant chat config anchor not found');
            else {
              const updated = content.replace(old, replacement).replace("response=await chat.sendMessage({message:parts,config:{abortSignal:abortController.signal}});", "response=await chat.sendMessage({message:parts,config:{...chatConfig,abortSignal:abortController.signal}});");
              const { data: current } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: 'fix: preserve assistant tools across context turns', content: Buffer.from(updated, 'utf8').toString('base64'), sha: current.sha, branch: 'main' });
            }
            const workflowPath = '.github/workflows/assistant-context-config-repair.yml';
            const { data: workflowFile } = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'main' });
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, message: 'chore: remove temporary assistant config repair workflow', sha: workflowFile.sha, branch: 'main' });
