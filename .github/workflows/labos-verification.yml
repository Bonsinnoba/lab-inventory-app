name: LabOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: BOM and Requirements regression tests
        run: node --experimental-strip-types --test src/api/operations-calculations.test.mjs
      - run: npm run build

  backend:
    name: Backend syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Security and permission regression tests
        run: npm run test:security-baseline
      - name: Reserved-stock and context regression tests
        run: node --test src/reservation-stock.test.js src/routes/context.test.js src/context-relationships.test.js src/context-evidence.test.js

  postgres-integration:
    name: PostgreSQL migrations and schema integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labos_test
          POSTGRES_PASSWORD: labos_test
          POSTGRES_DB: labos_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labos_test -d labos_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: labos_test
      PGPASSWORD: labos_test
      PGDATABASE: labos_integration
      LABOS_INTEGRATION_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Migrate clean PostgreSQL database
        run: npm run migrate
      - name: Verify migration replay is idempotent
        run: npm run migrate
      - name: Exercise real schema and finance query
        run: node --test src/postgres-integration.test.js

  rust:
    name: Tauri Rust check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build frontend required by Tauri generate_context
        working-directory: desktop
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Materialize PNG icon required by Tauri context
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          icons = Path("icons")
          ico = base64.b64decode((icons / "icon.ico.b64").read_text())
          image = Image.open(BytesIO(ico))
          image.save(icons / "icon.png", format="PNG")
          PY
      - run: cargo check --locked
