name: LabOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop TypeScript and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check

  rust:
    name: Tauri Rust check
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build frontend required by Tauri generate_context
        working-directory: desktop
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Materialize PNG icon required by Tauri context
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          icons = Path("icons")
          ico = base64.b64decode((icons / "icon.ico.b64").read_text())
          image = Image.open(BytesIO(ico))
          image.save(icons / "icon.png", format="PNG")
          PY
      - run: cargo check --locked
