name: LabOS assistant context repair v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch assistant context behavior
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'backend/src/routes/assistant.js';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const content = Buffer.from(file.content, 'base64').toString('utf8');
            const oldInstruction = '- Never invent inventory quantities, project figures, dates, people, files, or other laboratory facts. Use tools when factual lab data is needed.';
            const newInstruction = '- Never invent inventory quantities, project figures, dates, people, files, or other laboratory facts. Use tools when factual lab data is needed. When context is enabled and a question asks about laboratory data covered by the available tools, you MUST call the relevant tool before answering.';
            if (!content.includes(oldInstruction)) core.setFailed('Assistant safety instruction anchor not found');
            else {
              let updated = content.replace(oldInstruction, newInstruction);
              const oldChat = "const chat=ai.chats.create({model:MODEL_NAME,history,config:{tools:[{functionDeclarations:availableTools.map(t=>({name:t.name,description:t.description,parametersJsonSchema:t.parameters}))}],systemInstruction:scopedSystemInstruction(context)}});";
              const newChat = "const forceContextTool=/\\b(how many|count|exists?|list|show|which|who|when|where|how much|experiment|experiments|task|tasks|note|notes|resource|resources|inventory|item|items|budget|expense|expenses|transaction|transactions|activity|members?|quantity|status|details|project)\\b/i.test(message)&&context.scope!=='none';const chat=ai.chats.create({model:MODEL_NAME,history,config:{tools:[{functionDeclarations:availableTools.map(t=>({name:t.name,description:t.description,parametersJsonSchema:t.parameters}))}],systemInstruction:scopedSystemInstruction(context),...(forceContextTool?{toolConfig:{functionCallingConfig:{mode:'ANY'}}}:{})}});";
              if (!updated.includes(oldChat)) core.setFailed('Assistant chat configuration anchor not found');
              else {
                updated = updated.replace(oldChat, newChat);
                const { data: current } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: 'fix: force factual assistant context tool use', content: Buffer.from(updated, 'utf8').toString('base64'), sha: current.sha, branch: 'main' });
              }
            }
            const workflowPath = '.github/workflows/project-activity-pagination.yml';
            const { data: workflowFile } = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'main' });
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, message: 'chore: remove temporary assistant context repair workflow', sha: workflowFile.sha, branch: 'main' });
